# CI skeleton. Enable the commented steps in task T002, once the scaffold exists.
# Actions are pinned to full commit SHAs (version in the trailing comment),
# looked up on 2026-10-16 — a moving tag lets a compromised action run here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the default token can only read the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
