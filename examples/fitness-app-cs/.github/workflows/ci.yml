# Kostra CI. Zakomentované kroky zapni v úkolu T002, až bude existovat
# kostra aplikace ve složce mobile/. Každá akce je připnutá na celé SHA
# commitu (verze v komentáři) — posunutý tag by mohl spustit kompromitovanou
# akci. Ověřeno 2026-10-16 přes git ls-remote (docs/blueprint/SOURCES.md S22–S24).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nejmenší oprávnění: výchozí token smí repozitář jen číst.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks prochází historii
      # Skenování tajemství (vysoké riziko). Pro osobní účet zdarma; u organizace
      # vyžaduje licenční klíč (UNVERIFIED — ověřit v T002).
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
